# Learn more about configuring your checkout UI extension:
# https://shopify.dev/docs/api/checkout-ui-extensions/latest/configuration

# The version of APIs your extension will receive. Learn more:
# https://shopify.dev/docs/api/usage/versioning
api_version = "2026-07"

[[extensions]]
name = "gift-checkout"
handle = "gift-checkout"
type = "ui_extension"
uid = "60b2aa2b-dcdc-5a6b-7ea3-b1ca80f2175ffbe48229"

# Controls where in Shopify your extension will be injected,
# and the file that contains your extension’s source code. Learn more:
# https://shopify.dev/docs/api/checkout-ui-extensions/latest/extension-targets-overview

[[extensions.targeting]]
module = "./src/Checkout.jsx"
target = "purchase.checkout.block.render"

[extensions.capabilities]
# Gives your extension access to directly query Shopify’s storefront API.
# https://shopify.dev/docs/api/checkout-ui-extensions/latest/configuration#api-access
api_access = true

# Required so checkout can load the gift box image.
# https://shopify.dev/docs/api/checkout-ui-extensions/latest/configuration#network-access
network_access = true

# Loads metafields on checkout resources, including the cart,
# products, customers, and more. Learn more:
# https://shopify.dev/docs/api/checkout-ui-extensions/latest/configuration#metafields

[[extensions.metafields]]
namespace = "custom"
key = "gift_message"

[[extensions.metafields]]
namespace = "$app"
key = "gift_message"

# Merchants edit these in the checkout editor. Blank fields keep the default copy.

[extensions.settings]
[[extensions.settings.fields]]
key = "returns_title"
type = "single_line_text_field"
name = "Returns title"
description = "Heading for the returns row. Leave blank to use the default."
[[extensions.settings.fields.validations]]
name = "max"
value = "100"

[[extensions.settings.fields]]
key = "returns_body"
type = "multi_line_text_field"
name = "Returns details"
description = "Text shown when returns is opened. You can use <p>, <br>, <hr>, <b>, <strong>, <em>, <i>, <ul>, and <li>. Leave blank to use the default."
[[extensions.settings.fields.validations]]
name = "max"
value = "2000"

[[extensions.settings.fields]]
key = "shipping_title"
type = "single_line_text_field"
name = "Shipping title"
description = "Heading for the shipping row. Leave blank to use the default."
[[extensions.settings.fields.validations]]
name = "max"
value = "100"

[[extensions.settings.fields]]
key = "shipping_body"
type = "multi_line_text_field"
name = "Shipping details"
description = "Text shown when shipping is opened. You can use <p>, <br>, <hr>, <b>, <strong>, <em>, <i>, <ul>, and <li>. Leave blank to use the default."
[[extensions.settings.fields.validations]]
name = "max"
value = "2000"

[[extensions.settings.fields]]
key = "gift_title"
type = "single_line_text_field"
name = "Gift message title"
description = "Heading for the gift message row. Leave blank to use the default."
[[extensions.settings.fields.validations]]
name = "max"
value = "100"

[[extensions.settings.fields]]
key = "gift_description"
type = "multi_line_text_field"
name = "Gift message details"
description = "Text shown beside the packaging image. You can use <p>, <br>, <hr>, <b>, <strong>, <em>, <i>, <ul>, and <li>. Leave blank to use the default."
[[extensions.settings.fields.validations]]
name = "max"
value = "2000"

[[extensions.settings.fields]]
key = "gift_image_url"
type = "single_line_text_field"
name = "Gift packaging image URL"
description = "Optional HTTPS image URL. Leave blank to use the default gift box image."
[[extensions.settings.fields.validations]]
name = "max"
value = "500"

[[extensions.settings.fields]]
key = "gift_image_alt"
type = "single_line_text_field"
name = "Gift packaging image description"
description = "Short description of the packaging image for screen readers. Leave blank to use the default."
[[extensions.settings.fields.validations]]
name = "max"
value = "150"

[[extensions.settings.fields]]
key = "gift_message_max_length"
type = "number_integer"
name = "Gift message character limit"
description = "Maximum characters a customer can enter. Leave blank to use 150."
